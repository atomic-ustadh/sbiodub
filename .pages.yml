media:
  input: public/media
  output: /media
  rename: safe

content:
  - name: resources
    label: Resources
    type: collection
    path: src/content/resources
    format: json
    filename: "{primary}.json"
    view:
      primary: title
      fields: [title, category, date, featured]
      sort: [date, title, category]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - Faith & Spirit
            - Professional Skills
            - Mental Wellness
            - Community Action
      - name: type
        label: Resource type
        type: select
        required: true
        options:
          values:
            - Guide
            - Article
            - Video
      - name: excerpt
        label: Summary
        type: text
        required: true
        options:
          maxlength: 300
      - name: content
        label: Body
        type: rich-text
        required: true
        options:
          format: html
          switcher: true
          media: false
      - name: author
        label: Author
        type: string
        required: true
      - name: date
        label: Publish date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: featured
        label: Featured
        type: boolean

  - name: events
    label: Events
    type: collection
    path: src/content/events
    format: json
    filename: "{primary}.json"
    view:
      primary: title
      fields: [title, category, date]
      sort: [date, title]
      default:
        sort: date
        order: asc
    fields:
      - name: id
        label: Stable ID
        type: string
        description: Do not change existing IDs. Leave empty for new events; the filename will be used.
      - name: title
        label: Title
        type: string
        required: true
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - Educational
            - Social
            - Sports
            - Spiritual
      - name: image
        label: Cover image
        type: image
        required: true
        options:
          categories: [image]
      - name: date
        label: Event date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: time
        label: Time
        type: string
        required: true
      - name: location
        label: Location
        type: string
        required: true
      - name: description
        label: Description
        type: text
        required: true

  - name: testimonials
    label: Testimonials
    type: collection
    path: src/content/testimonials
    format: json
    filename: "{primary}.json"
    view:
      primary: name
      fields: [name, title, order]
      sort: [name, order]
      default:
        sort: order
        order: asc
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: title
        label: Subtitle
        type: string
        required: true
        description: e.g. Member since 2021
      - name: quote
        label: Quote
        type: text
        required: true
      - name: image
        label: Portrait
        type: image
        required: true
        options:
          categories: [image]
      - name: order
        label: Display order
        type: number
        required: true
        description: Lower numbers appear first in the carousel.

  - name: leadership
    label: Leadership
    type: collection
    path: src/content/leadership
    format: json
    filename: "{primary}.json"
    view:
      primary: name
      fields: [name, role, order]
      sort: [name, role, order]
      default:
        sort: order
        order: asc
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: role
        label: Role
        type: string
        required: true
      - name: description
        label: Description
        type: text
        required: true
      - name: image
        label: Portrait
        type: image
        required: true
        options:
          categories: [image]
      - name: order
        label: Display order
        type: number
        required: true
        description: Lower numbers appear first on the About page.

  - name: faq
    label: FAQ
    type: collection
    path: src/content/faq
    format: json
    filename: "{primary}.json"
    view:
      primary: question
      fields: [question, order]
      sort: [question, order]
      default:
        sort: order
        order: asc
    fields:
      - name: question
        label: Question
        type: string
        required: true
      - name: answer
        label: Answer
        type: rich-text
        required: true
        options:
          format: html
          switcher: true
          media: false
      - name: order
        label: Display order
        type: number
        required: true
        description: Lower numbers appear first on the FAQ page.

  - name: legal
    label: Legal Pages
    type: collection
    path: src/content/legal
    format: json
    filename: "{primary}.json"
    view:
      primary: title
      fields: [title, slug, lastUpdated]
      sort: [title, lastUpdated]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: URL slug
        type: string
        required: true
        pattern: "^(privacy|terms)$"
        description: Use "privacy" or "terms". Do not change existing values.
      - name: lastUpdated
        label: Last updated
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: content
        label: Content
        type: rich-text
        required: true
        options:
          format: html
          switcher: true
          media: false

  - name: donate
    label: Donate Page
    type: file
    path: src/content/donate.json
    format: json
    fields:
      - name: bankName
        label: Bank name
        type: string
        required: true
      - name: accountName
        label: Account name
        type: string
        required: true
      - name: accountNumber
        label: Account number
        type: string
        required: true
      - name: whatsappNumber
        label: WhatsApp number
        type: string
        required: true
        description: Include the country code, digits only, e.g. 2348012345678.
      - name: quote
        label: Donor quote
        type: text
        required: true
      - name: quoteAuthor
        label: Quote author
        type: string
        required: true
      - name: quoteRole
        label: Quote author role
        type: string
        required: true
      - name: destinations
        label: Donation destinations
        type: object
        list: true
        required: true
        fields:
          - name: label
            label: Destination
            type: string
            required: true
          - name: description
            label: Description
            type: text
            required: true
          - name: kind
            label: Type
            type: select
            required: true
            options:
              values:
                - donation
                - payment
            description: Use "payment" when the money is for a programme or event.
      - name: faqs
        label: FAQ
        type: object
        list: true
        required: true
        fields:
          - name: question
            label: Question
            type: string
            required: true
          - name: answer
            label: Answer
            type: text
            required: true

  - name: about
    label: About Page
    type: file
    path: src/content/about.json
    format: json
    fields:
      - name: journeyEyebrow
        label: Journey eyebrow
        type: string
        required: true
      - name: journeyTitle
        label: Journey title
        type: string
        required: true
      - name: journeyImage
        label: Journey image
        type: image
        required: true
        options:
          categories: [image]
      - name: journeyContent
        label: Journey content
        type: rich-text
        required: true
        options:
          format: html
          switcher: true
          media: false
      - name: pillarsTitle
        label: Pillars title
        type: string
        required: true
      - name: pillarsIntro
        label: Pillars introduction
        type: text
        required: true
      - name: pillars
        label: Pillars
        type: object
        list: true
        required: true
        fields:
          - name: icon
            label: Icon
            type: string
            required: true
            description: Material Symbols icon name, e.g. mosque, groups, stars.
          - name: title
            label: Title
            type: string
            required: true
          - name: description
            label: Description
            type: text
            required: true
          - name: style
            label: Card style
            type: select
            required: true
            options:
              values:
                - default
                - primary
                - wide
                - full
            description: Controls the card width and border treatment.
          - name: image
            label: Image
            type: image
            options:
              categories: [image]
