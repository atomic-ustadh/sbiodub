[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/paystack/verify"
  to = "/.netlify/functions/paystack-verify"
  status = 200

[[redirects]]
  from = "/api/paystack/webhook"
  to = "/.netlify/functions/paystack-webhook"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
