# Netlify deployment configuration.
# - Builds the Vite SPA, publishes dist/, and bundles Netlify Functions with esbuild.
# - Rewrites public /api/paystack/* paths to serverless functions (keeps browser calls
#   same-origin; function names stay internal).
# - SPA fallback serves the unprerendered shell for all non-matched routes so React
#   Router handles them client-side. Keep the catch-all redirect last.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/paystack/verify"
  to = "/.netlify/functions/paystack-verify"
  status = 200

[[redirects]]
  from = "/api/paystack/webhook"
  to = "/.netlify/functions/paystack-webhook"
  status = 200

[[redirects]]
  from = "/*"
  to = "/_spa.html"
  status = 200
